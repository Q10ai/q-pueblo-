name: Q-Pueblo public source read-only watch
on:
  schedule:
    - cron: '24 15 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check official source pages only (no publishing)
        run: node scripts/civic-source-watch.mjs
      - name: Preserve source availability receipts for human review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: q-pueblo-dated-source-watch
          path: watch-artifacts/*.json
          if-no-files-found: warn
          retention-days: 60
