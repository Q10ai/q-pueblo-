name: Q-Pueblo Public Beta Validation
on:
  push:
    branches: [main]
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JavaScript syntax
        run: |
          node --check public/site.js
          node --check public/research-atlas.js
          node --check public/launch-dashboard.js
          node --check scripts/audit-site.cjs
          node --check functions/api/v1/config.js
      - name: Validate required public pages and safety headers
        run: |
          test -s public/index.html
          test -s public/research-atlas.html
          test -s public/research-atlas.css
          test -s public/research-atlas.js
          test -s public/launch-dashboard.html
          test -s public/launch-dashboard.css
          test -s public/launch-dashboard.js
          grep -q 'id="categories"' public/launch-dashboard.html
          grep -q 'id="featuredPacks"' public/launch-dashboard.html
          grep -q 'id="engineCards"' public/launch-dashboard.html
          grep -q 'id="agentCards"' public/launch-dashboard.html
          grep -q 'research-atlas.js' public/research-atlas.html
          test -s public/site.css
          test -s public/_headers
          grep -q 'Q-PUEBLO' public/index.html
          grep -q 'contributions_enabled: false' functions/api/v1/config.js
          grep -q "Content-Security-Policy" public/_headers
      - name: Audit Q-Pueblo site coverage and reverse graph integrity
        run: |
          node scripts/audit-site.cjs
      - name: Verify Cloudflare Direct Upload review archive
        run: |
          unzip -t qpueblo-v2-dashboard-review.zip
          test "$(unzip -Z -1 qpueblo-v2-dashboard-review.zip | wc -l)" -eq 15
          unzip -p qpueblo-v2-dashboard-review.zip index.html | cmp - public/index.html
          unzip -p qpueblo-v2-dashboard-review.zip launch-dashboard.js | cmp - public/launch-dashboard.js
          unzip -p qpueblo-v2-dashboard-review.zip research-atlas.js | cmp - public/research-atlas.js
          unzip -p qpueblo-v2-dashboard-review.zip qpueblo-mark.jpg | cmp - public/qpueblo-mark.jpg
      - name: Block obvious local credentials
        run: |
          test ! -e .env
          test ! -e .dev.vars
          test ! -e public/.env
