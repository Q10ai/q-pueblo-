name: Q-Pueblo Release Gate — Cross-layer
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test Q-Pueblo pure instruments and public contracts
        run: |
          node --test scripts/q-tools.test.mjs
          node --test backend/official-monitor.test.mjs
          python3 -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Validate source and browser-syntax files
        run: |
          node scripts/check-site-v3.mjs
          node --check public/portal-v2.js
          node --check public/q-tools.mjs
          node --check public/q-tools-core.mjs
          node --check public/reports.js
          node --check public/updates.js
          node --check public/updates-strip.js
          node --check functions/api/v1/contributions.js
          node --check backend/official-monitor.mjs
          bash -n scripts/check-live-parity.sh
      - name: Maintain compatible legacy catalog and workbench checks
        run: |
          node scripts/check-public-catalog.mjs
          node scripts/check-workbench.mjs
      - name: Package direct-upload ZIP with correct root and required assets
        if: github.ref == 'refs/heads/main'
        run: |
          cd public
          zip -q -r ../qpueblo-validated-release.zip .
          cd ..
          unzip -t qpueblo-validated-release.zip | tail -1
          unzip -Z1 qpueblo-validated-release.zip | grep -Fx 'tools.html'
          unzip -Z1 qpueblo-validated-release.zip | grep -Fx 'assets/q-pueblo-header.webp'
      - name: Preserve validated Cloudflare static upload artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: qpueblo-v3-cloudflare-static
          path: qpueblo-validated-release.zip
          retention-days: 30
