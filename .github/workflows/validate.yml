name: Q-Pueblo Public Beta Validation
on:
  push:
    branches: [main]
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JavaScript syntax
        run: |
          bash -n scripts/check-live-parity.sh
          node --check public/site.js
          node --check public/explore.js
          node --check public/issues.js
          node --check scripts/check-topic-nav.mjs
          node --check scripts/check-issue-index.mjs
          node --check public/qify-match.js
          node --check public/qify.js
          node --check scripts/check-qify.mjs
          node --check public/workbench.js
          node --check public/q-tools.js
          node --check public/workbench-spec.js
          node --check scripts/check-workbench.mjs
          node --check scripts/check-public-release.mjs
          node --check public/data/q-pueblo-public-catalog-2026-11-08.js
          node --check scripts/check-public-catalog.mjs
          node --check functions/api/v1/config.js
      - name: Validate required public pages and safety headers
        run: |
          test -s public/index.html
          test -s public/launch.html
          test -s public/release.css
          node scripts/check-public-release.mjs
          test -s public/explore.html
          test -s public/explore.css
          test -s public/data/q-pueblo-public-catalog-2026-11-08.js
          node scripts/check-public-catalog.mjs
          test -s public/issues.html
          test -s public/issues.css
          test -s public/issues.js
          test -s public/data/q-pueblo-issue-index-2026-11-09.json
          test -s public/data/q-pueblo-issue-index-2026-11-09.csv
          node scripts/check-issue-index.mjs
          test -s public/topics.html
          test -s public/topics.css
          node scripts/check-topic-nav.mjs
          node --check public/support.js
          node scripts/check-support-inquiries.mjs
          test -s public/workbench.html
          test -s public/workbench.css
          test -s public/workbench-spec.js
          test -s public/packet-schema.json
          node -e "JSON.parse(require('node:fs').readFileSync('public/packet-schema.json','utf8'))"
          node scripts/check-workbench.mjs
          node scripts/check-q-tools.mjs
          node scripts/check-qify.mjs
          test -s public/site.css
          test -s public/_headers
          grep -q 'Q-PUEBLO' public/index.html
          grep -q 'contributions_enabled: false' functions/api/v1/config.js
          grep -q "Content-Security-Policy" public/_headers
      - name: Package static Cloudflare Pages upload
        if: github.ref == 'refs/heads/main'
        run: |
          cd public
          zip -q -r ../q-pueblo-cloudflare-pages.zip .
          cd ..
          test -s q-pueblo-cloudflare-pages.zip
          unzip -l q-pueblo-cloudflare-pages.zip | grep -q 'explore.html'
          unzip -l q-pueblo-cloudflare-pages.zip | grep -q 'workbench.html'
          unzip -l q-pueblo-cloudflare-pages.zip | grep -q 'index.html'
      - name: Preserve Pages upload bundle as Actions artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: q-pueblo-cloudflare-upload
          path: q-pueblo-cloudflare-pages.zip
          if-no-files-found: error
          retention-days: 30
      - name: Block obvious local credentials
        run: |
          test ! -e .env
          test ! -e .dev.vars
          test ! -e public/.env
